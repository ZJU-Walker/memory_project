# Real-robot deploy config for pi05_long_task_mem_lora.
# Right wrist camera is NOT used at runtime — the right_wrist_0_rgb slot
# is filled by the StageManager (observe keyframe on query stages, zeros
# otherwise) via the training-time YamLongTaskInputs transform.
robot:
  channel: can_left
cameras:
  top_serial:  "409122273280"
  left_serial: "409122271088"
# No `prompt` field — instructions come from QueryPlan / StageManager.

# Used only by run_long_task_retriever.py — ignored by run_long_task.py.
retriever:
  ckpt: retriever/runs/v1_0511/best.pt
  openpi_config: pi05_plate_task
  openpi_ckpt_dir: openpi/checkpoints/pi05_plate_task/plate_oracle_v2_0510/29999
  rewriter_model: gemini-2.5-flash
  memory_sample_hz: 1.0
  device: cuda
